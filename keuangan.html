<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bugar Connect — Server Dorman</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/BUGAR-WEBAPP-V1/main/logo%20bugar.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050505; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .orb { position: absolute; width: 360px; height: 360px; border-radius: 999px; background: rgba(255,69,58,.11); filter: blur(100px); pointer-events: none; }
    .panel { background: rgba(24,24,27,.72); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  </style>
</head>
<body>
  <main class="relative min-h-screen flex items-center justify-center px-5 py-12 overflow-hidden">
    <div class="orb -top-28 left-1/2 -translate-x-1/2"></div>
    <div class="orb -bottom-48 -right-24"></div>
    <section class="panel relative w-full max-w-lg rounded-3xl px-7 py-10 sm:px-12 sm:py-12 text-center shadow-2xl">
      <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/BUGAR-WEBAPP-V1/main/logo%20bugar.png" alt="Bugar" class="h-16 max-w-[180px] object-contain mx-auto mb-8" onerror="this.style.display='none'">
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-red-400/20 bg-red-500/10 text-red-400">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3M8 10l2 2 5-5"/></svg>
      </div>
      <p class="text-[11px] font-bold uppercase tracking-[.32em] text-red-400">Bugar Connect</p>
      <h1 class="mt-3 text-3xl sm:text-4xl font-black tracking-tight">Server Dorman</h1>
      <div class="mx-auto mt-5 flex w-fit items-center gap-2 rounded-full border border-amber-400/20 bg-amber-400/10 px-3 py-1.5 text-xs font-semibold text-amber-300">
        <span class="h-2 w-2 rounded-full bg-amber-400"></span>
        Layanan sementara tidak aktif
      </div>
      <p class="mt-6 text-sm sm:text-base leading-7 text-white/60">Sistem Bugar Connect sedang dalam status dorman untuk sementara waktu.</p>
      <p class="mt-2 text-sm leading-6 text-white/45">Silakan hubungi administrator untuk informasi dan aktivasi kembali layanan.</p>
      <div class="mt-9 border-t border-white/10 pt-5 text-[10px] font-medium uppercase tracking-[.22em] text-white/25">Bugar Connect · System Status</div>
    </section>
  </main>
</body>
</html>
